; Daoa Mini — Cardputer ADV. Trois environnements :
;   cardputer-adv : firmware (Arduino-ESP32 3.x via pioarduino)
;   sim           : simulateur macOS (LovyanGFX + SDL2 Homebrew)
;   test-native   : tests unitaires de la logique de tirage

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = m5stack-stamps3
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    ricmoo/QRCode@^0.0.1
build_src_filter = +<*> -<sim/>
monitor_speed = 115200

[env:sim]
platform = native
build_type = debug
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    ricmoo/QRCode@^0.0.1
lib_compat_mode = off
build_flags =
    -std=c++17
    -O1
    -g
    -DDAOA_SIM=1
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter = +<core/> +<anim/> +<ui/> +<sim/>

[env:test-native]
platform = native
build_flags = -std=c++17
build_src_filter = +<core/> +<ui/text_rules.cpp>
test_build_src = yes
